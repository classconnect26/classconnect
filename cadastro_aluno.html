<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylecadastro_aluno.css">
</head>
<body>
    <div class="container">

        <div class="form_box">
            <div class="backimg">

                <img id="pomba" src="assets/tela de cadastro - pomba.png" width="20%" height="20%">
                <h2 id="cadastro">CADASTRO</h2>

            </div>
            <form>
                <div class="inputs">
                    <img id="usericon" src="assets/usercadastro.png" width="30%" height="30%">
                    <input type="text" id="nome" name="nome" placeholder="nome de usuário" required>
                    <input type="text" id="email" name="email" placeholder="seu@email.com" required>
                    <input type="password" id="senha" name="senha" placeholder="senha" required>
                    <input type="password" id="csenha" name="csenha" placeholder="confirmar senha" required>
                    <div class="btnladoalado">
                        
                        <input id="turma" type="text" name="turma" placeholder="turma" required disabled>
                        <select id="escola" name="escola" placeholder="escola" required>
                            <option value="">Selecione uma escola</option>
                        </select>

                    </div>   
                    <button type="submit" name="Avançar">Avançar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scriptcadastro_aluno.js"></script>
</body>
</html>
