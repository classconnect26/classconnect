<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylecadastro_professor.css">
</head>
<body>
    <div class="container">

        <div class="form_box">
            <div class="backimg">

                <img id="pomba" src="assets/tela de cadastro - pomba.png" width="20%" height="20%">
                <h2 id="cadastro">CADASTRO</h2>

            </div>
            <form action="" method="post">
                <div class="inputs">
                    <img id="usericon" src="assets/usercadastro.png" width="30%" height="30%">
                    <input type="text" name="Escola" placeholder="nome da escola" required>
                    <input type="text" name="cnpj" placeholder="CNPJ" required>
                    <input type="password" name="Senha" placeholder="senha" required>
                    <input type="password" name="CSenha" placeholder="confirmar senha" required>
                    <button type="submit" name="Avançar">Avançar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
